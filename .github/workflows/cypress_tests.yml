name: Cypress tests

on:
  workflow_dispatch:

jobs:
  test_cypress:
     runs-on: ubuntu-latest

     steps:
       - name: Checkout
         uses: actions/checkout@v4
         with:
           lfs: true

       - name: Docker login
         uses: docker/login-action@v2
         with:
           username: ${{ secrets.DOCK_HUB_USER }}
           password: ${{ secrets.DOCK_HUB_TOKEN }}
           
       - name: Run Docker container
         run: |
           docker compose up -d

       - name: Install Cypress dependencies
         run: npm ci

       - name: Run Cypress tests
         run: |
           echo "Running Cypress tests in Docker container"
           npm run cy:run
