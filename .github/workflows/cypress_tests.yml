name: Cypress tests

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email used to receive the PDF'
        required: true
        default: pdf_testmail@yopmail.com
        type: string
      file_name:
        description: 'Name of the PDF file'
        required: true
        default: test_pdf_ana
        type: string

jobs:
  test_cypress:
     runs-on: ubuntu-latest

     steps:
       - name: Checkout
         uses: actions/checkout@v4
         with:
           lfs: true

       - name: Docker login
         uses: docker/login-action@v2
         with:
           username: ${{ secrets.DOCK_HUB_USER }}
           password: ${{ secrets.DOCK_HUB_TOKEN }}
           
       - name: Run Docker container
         run: |
           docker compose up -d

       - name: Install Cypress dependencies
         run: npm ci

       - name: Run Cypress tests
         run: |
           echo "Running Cypress tests in Docker container"
           npx cypress run --env url=http://localhost:5000/pdf,file_name=${{ inputs.file_name }},email=${{ inputs.email }} --reporter mochawesome
           
       - name: Upload artifact
         uses: actions/upload-artifact@v4
         if: always()
         with:
           name: report
           path: mochawesome-report
           retention-days: 30

       - name: Stop and clean up
         run: |
           docker compose down --rmi all || true
